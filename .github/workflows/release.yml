name: Release

# Push a tag such as v1.0.1 (matching package.json "version") to build and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # electron-builder publishes each target in parallel and would otherwise create one draft per
      # publisher on a fresh tag (seen on v1.0.1). Create the draft first so all uploads share it.
      - name: Create draft release
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and upload assets
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The Firefox extension ships as an .xpi. Release Firefox only installs add-ons signed by Mozilla, so the file
      # is signed (unlisted channel) when the AMO_JWT_ISSUER / AMO_JWT_SECRET repository secrets exist; otherwise the
      # unsigned build is attached for Developer Edition, Nightly and temporary loading.
      - name: Build and attach Firefox extension
        shell: bash
        run: |
          node scripts/build-extension.js
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            npx --yes web-ext@8 sign --source-dir dist/extension-stage --artifacts-dir dist/signed \
              --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
            cp dist/signed/*.xpi "dist/f95-tracker-companion-${GITHUB_REF_NAME#v}.xpi"
            gh release upload "$GITHUB_REF_NAME" "dist/f95-tracker-companion-${GITHUB_REF_NAME#v}.xpi" --clobber
          else
            gh release upload "$GITHUB_REF_NAME" dist/f95-tracker-companion-*-unsigned.xpi --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      - name: Publish release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
